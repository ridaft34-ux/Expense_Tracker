<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Expense</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="container">

        <section class="section">

            <h2>✏️ Edit Expense</h2>

            <form
                action="{{ url_for('edit', expense_id=expense['id']) }}"
                method="POST"
            >

                <div class="form-row">

                    <div class="form-group">

                        <label for="amount">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            value="{{ expense['amount'] }}"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            name="category"
                            required
                        >

                            {% for category in [
                                "Food",
                                "Transport",
                                "Shopping",
                                "Bills",
                                "Education",
                                "Entertainment",
                                "Health",
                                "Other"
                            ] %}

                            <option
                                value="{{ category }}"
                                {% if expense['category'] == category %}
                                selected
                                {% endif %}
                            >
                                {{ category }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            value="{{ expense['date'] }}"
                            required
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group description-group">

                        <label for="description">
                            Description
                        </label>

                        <input
                            type="text"
                            id="description"
                            name="description"
                            value="{{ expense['description'] or '' }}"
                            placeholder="What did you spend on?"
                        >

                    </div>

                </div>


                <div class="actions">

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        💾 Save Changes
                    </button>


                    <a href="{{ url_for('home') }}" class="cancel-button">Cancel</a>

                </div>

            </form>

        </section>

    </div>

</body>

</html>
